# Fisier de configurare pentru clonare.sh (CF-03)
#
# Parametrii din linia de comanda au prioritate fata de valorile de aici
# Se citeste cu: ./clonare.sh --config ../config/clonare.conf

# Rolul masinii pe care ruleaza scriptul: sursa | destinatie
CONF_MOD="sursa"

# Adresa IP a celeilalte masini
CONF_TINTA="192.168.56.102"

# Utilizatorul folosit pentru conexiunea SSH
CONF_USER="vladescu"

# Categoriile care se colecteaza si se compara
CONF_CATEGORII="pachete,utilizatori,home,cron"

# Locatia fisierului de jurnal (CF-23)
CONF_JURNAL="../logs/clonare.log"

# Directoare suplimentare de clonat, pe langa home-directory-uri (CF-16)
# Separate prin spatiu.
CONF_DIRECTOARE="/opt/scripts"
